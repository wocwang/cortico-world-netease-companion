name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run describe
      - name: Verify generated describe.json
        run: git diff --exit-code -- describe.json
      - run: npm run check
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }
      - name: Publish to npm (skip if version already exists)
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          # registry 传播有延迟：手动发布后立刻打 tag 时，第一次查询常常还看不到新版本。
          # 查不到就重试（最多约 3.5 分钟），避免把「刚发过的版本」当成「还没发」而误触发 npm publish。
          $published = $false
          for ($i = 1; $i -le 8; $i++) {
            npm view "$($package.name)@$($package.version)" version 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            if ($i -lt 8) { Start-Sleep -Seconds 30 }
          }
          if ($published) {
            Write-Output "$($package.name)@$($package.version) already published; skipping npm publish."
            exit 0
          }
          if (-not $env:NODE_AUTH_TOKEN) {
            throw "NPM_TOKEN is not configured"
          }
          npm publish --provenance --access public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release (skip if it exists)
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:GITHUB_REF_NAME already exists; skipping."
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
